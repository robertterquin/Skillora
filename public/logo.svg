<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Skillora Archimedes Owl Brandmark (High-Contrast for Light & Dark Surfaces) -->

  <!-- 1. Outer High-Contrast White Halo (Ensures 100% visibility on dark backgrounds like Vercel & dark tabs) -->
  <path
    d="M 28 42 C 28 24 42 16 60 16 C 78 16 92 24 92 42 V 70 C 92 90 78 104 60 104 C 42 104 28 90 28 70 Z"
    fill="#FFFFFF"
    stroke="#FFFFFF"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <path
    d="M 23 35 Q 34 29 45 33 M 97 35 Q 86 29 75 33"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- 2. Solid White Owl Body & Head Interior -->
  <path
    d="M 28 42 C 28 24 42 16 60 16 C 78 16 92 24 92 42 V 70 C 92 90 78 104 60 104 C 42 104 28 90 28 70 Z"
    fill="#FFFFFF"
    stroke="#0F172A"
    stroke-width="5.5"
    stroke-linejoin="round"
  />

  <!-- 3. Left Sculpted Wing Fold -->
  <path
    d="M 28 60 C 40 57 49 65 49 79 C 49 90 41 98 32 100"
    fill="#F8FAFC"
    stroke="#0F172A"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 4. Cobalt Blue Quill Feather Accent -->
  <path
    d="M 56 87 C 59 71 73 64 79 65 C 80 76 71 88 56 90 Z"
    fill="#2563EB"
  />
  <path
    d="M 52 93 L 72 71"
    stroke="#1D4ED8"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- 5. Scholarly Ear Tufts / Brow Arch -->
  <path
    d="M 24 35 Q 34 29 45 33"
    stroke="#0F172A"
    stroke-width="5"
    stroke-linecap="round"
  />
  <path
    d="M 96 35 Q 86 29 75 33"
    stroke="#0F172A"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- 6. Spectacles Left & Right Lenses + Bridge -->
  <circle cx="44" cy="46" r="12.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
  <circle cx="76" cy="46" r="12.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
  <path
    d="M 56.5 45 Q 60 41.5 63.5 45"
    stroke="#0F172A"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- 7. Expressive Pupils & Crisp Catchlights -->
  <circle cx="44" cy="46" r="5.5" fill="#0F172A" />
  <circle cx="45.8" cy="44.2" r="1.8" fill="#FFFFFF" />

  <circle cx="76" cy="46" r="5.5" fill="#0F172A" />
  <circle cx="77.8" cy="44.2" r="1.8" fill="#FFFFFF" />

  <!-- 8. Precision Beak -->
  <path
    d="M 56 54 L 60 61 L 64 54"
    stroke="#0F172A"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
